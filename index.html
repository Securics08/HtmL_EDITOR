function getLatestProject(arr){
  if(!arr||!arr.length) return null;
  let latest=arr[0];
  let latestTime=0;
  try{
    // Try parse time field
    for(let item of arr){
      let t=0;
      if(item.time){
        // Format: "2026. 05. 05. 12:49:03" or locale
        const m=item.time.match(/(\d{4}).*?(\d{2}).*?(\d{2}).*?(\d{2}):(\d{2}):(\d{2})/);
        if(m){
          t=new Date(parseInt(m[1]), parseInt(m[2])-1, parseInt(m[3]), parseInt(m[4]), parseInt(m[5]), parseInt(m[6])).getTime();
        }else{
          // Try Date parse
          const d=new Date(item.time);
          if(!isNaN(d)) t=d.getTime();
        }
      }
      // Fallback to id
      if(!t) t=item.id||0;
      let latestT=0;
      if(latest.time){
        const mm=latest.time.match(/(\d{4}).*?(\d{2}).*?(\d{2}).*?(\d{2}):(\d{2}):(\d{2})/);
        if(mm) latestT=new Date(parseInt(mm[1]), parseInt(mm[2])-1, parseInt(mm[3]), parseInt(mm[4]), parseInt(mm[5]), parseInt(mm[6])).getTime();
        else{
          const dd=new Date(latest.time);
          if(!isNaN(dd)) latestT=dd.getTime();
          else latestT=latest.id||0;
        }
      }else latestT=latest.id||0;
      
      if(t>latestTime || t>latestT){
        if(t>=latestTime){
          latest=item;
          latestTime=t;
        }
      }
    }
  }catch(e){ 
    // Fallback max id
    let maxId=0;
    for(let it of arr){ if((it.id||0)>maxId){ maxId=it.id; latest=it; } }
  }
  return latest;
}

function updateAllCounts(){
  totalAllCount=0;
  let processed=0;
  for(let i=1;i<=100;i++){
    const lsKey="NeonRepoV5_LS_"+i;
    try{
      const arr=JSON.parse(localStorage.getItem(lsKey)||"[]");
      if(arr.length>0){
        updateCnt(i, arr.length);
        totalAllCount+=arr.length;
        processed++;
        if(processed>=7) updateTitleWithTotal();
        continue;
      }
    }catch(e){}
    (function(repoId){
      try{
        const req=indexedDB.open("NeonRepoV5_"+repoId,1);
        req.onsuccess=e=>{
          try{
            const d=e.target.result;
            if(!d.objectStoreNames.contains("projects")){
              processed++;
              if(processed>=7) updateTitleWithTotal();
              d.close(); return;
            }
            const tx=d.transaction("projects","readonly");
            tx.objectStore("projects").getAll().onsuccess=ev=>{
              const cnt=ev.target.result.length;
              if(cnt>0){
                updateCnt(repoId, cnt);
                totalAllCount+=cnt;
              }
              processed++;
              if(processed>=7) updateTitleWithTotal();
              d.close();
            };
            tx.objectStore("projects").getAll().onerror=()=>{
              processed++;
              if(processed>=7) updateTitleWithTotal();
              try{d.close();}catch(ex){}
            };
          }catch(ex){
            processed++;
            if(processed>=7) updateTitleWithTotal();
          }
        };
        req.onerror=()=>{
          processed++;
          if(processed>=7) updateTitleWithTotal();
        };
      }catch(ex){
        processed++;
        if(processed>=7) updateTitleWithTotal();
      }
    })(i);
  }
  setTimeout(()=>{updateTitleWithTotal();}, 1200);
}

function saveToDB(){
  const nameEl=document.getElementById("fileName");
  const codeEl=document.getElementById("editor");
  let rawName=nameEl.value.trim() || "Repo"+currentDB+"_"+Date.now();
  // Remove existing leading numbers user might have typed: 001_, 1-, 1 etc
  let baseName=rawName.replace(/^\d+[_\-\s]*/, '').trim() || rawName;
  const code=codeEl.value;
  if(!code.trim()){alert("Üres a kód!"); return;}
  const color=neonColors[Math.floor(Math.random()*neonColors.length)]; window._lastSavedColor=color;
  
  // Auto sorszám: if editing keep old number, else next number
  let finalName;
  if(activeId){
    // Editing: keep existing prefix if exists
    try{
      const existingArr=getLS();
      const existing=existingArr.find(x=>x.id===activeId);
      if(existing && existing.fileName){
        // Keep its number prefix
        const m=existing.fileName.match(/^(\d+)_/);
        if(m) finalName=m[1]+'_'+baseName;
        else finalName=existing.fileName.replace(/^\d+[_\-\s]*/, '').trim() ? existing.fileName.match(/^(\d+)_/)?.[1]+'_'+baseName : baseName;
        // fallback keep original fileName if baseName same
        if(!finalName || finalName.startsWith('_')) finalName=existing.fileName;
        else{
          // If existing already has correct base, keep number
          const existingBase=existing.fileName.replace(/^\d+[_\-\s]*/, '');
          if(existingBase===baseName) finalName=existing.fileName;
        }
      }else{
        finalName=baseName;
      }
    }catch(e){ finalName=baseName; }
    if(!finalName) finalName=baseName;
  }else{
    // New: auto increment
    let nextNum=1;
    try{
      const arr=getLS();
      nextNum=arr.length+1;
      // Find max number to avoid duplicate after deletions
      let max=0;
      arr.forEach(x=>{
        const fn=x.fileName||x.name||'';
        const mm=fn.match(/^(\d+)_/);
        if(mm){ const n=parseInt(mm[1],10); if(n>max) max=n; }
      });
      if(max>=nextNum) nextNum=max+1;
    }catch(e){}
    const pad=String(nextNum).padStart(2,'0');
    finalName=pad+'_'+baseName;
  }
  
  const name=finalName;
  const obj={name,code,color,time:new Date().toLocaleString("hu-HU")};
  obj.fileName=finalName;
  // Azonnal fent mutatja a beírt nevet
  try{ updateLastName(currentDB, finalName); }catch(e){} // ensure both
  if(activeId) obj.id=activeId;

  if(useLS){
    let arr=getLS();
    if(activeId){
      const idx=arr.findIndex(x=>x.id===activeId);
      if(idx>=0) arr[idx]=obj; else {obj.id=Date.now(); arr.push(obj); activeId=obj.id;}
    }else{obj.id=Date.now(); arr.push(obj); activeId=obj.id;}
    setLS(arr);
    loadList();
    const now=new Date(); const pad=n=>String(n).padStart(2,'0');
    const d=now.getFullYear()+"-"+pad(now.getMonth()+1)+"-"+pad(now.getDate());
    const t=pad(now.getHours())+"-"+pad(now.getMinutes())+"-"+pad(now.getSeconds());
    const fname=currentDB+"_"+name.replace(/\s+/g,'_')+"_"+d+"_"+t+".json";
    downloadFile(JSON.stringify(obj,null,2), fname);
    setStatus("MENTVE LS: "+name,"#0f0");
    return;
  }

  if(!db){alert("DB még nem nyílt"); return;}
  try{
    const tx=db.transaction(STORE,"readwrite");
    const store=tx.objectStore(STORE);
    const req=store.put(obj);
    req.onsuccess=e=>{
      activeId=activeId||e.target.result;
      loadList();
      const now=new Date(); const pad=n=>String(n).padStart(2,'0');
      const d=now.getFullYear()+"-"+pad(now.getMonth()+1)+"-"+pad(now.getDate());
      const t=pad(now.getHours())+"-"+pad(now.getMinutes())+"-"+pad(now.getSeconds());
      const fname=currentDB+"_"+name.replace(/\s+/g,'_')+"_"+d+"_"+t+".json";
      downloadFile(JSON.stringify(obj,null,2), fname);
      setStatus("MENTVE: "+name,"#0f0");
    };
  }catch(e){useLS=true; saveToDB();}
}

    let defName="100in1_ALL_"+dateStr+"_"+timeFile;
    let name=prompt("Mind a 100 repo export neve:", defName);
    if(!name) return;
    if(!name.endsWith(".json")) name+=".json";
    setStatus("Exportálás mind a 100...","#ff0");
    const allRepos=[];
    let totalCount=0;
    for(let i=1;i<=100;i++){
      const lsKey="NeonRepoV5_LS_"+i;
      let lsData=[];
      try{lsData=JSON.parse(localStorage.getItem(lsKey)||"[]");}catch(e){lsData=[];}
      // LS data is reliable, IDB may contain same
      allRepos.push({repo:i, count:lsData.length, data:lsData});
      totalCount+=lsData.length;
      // Also update LAST name persistence
      try{
        if(lsData.length>0){
          const last=lsData[lsData.length-1];
          const lastName=last.fileName||last.name||"";
          if(lastName) localStorage.setItem('NeonRepoV5_LAST_'+i, lastName);
        }
      }catch(e){}
    }
    const exportObj={
      version:"V23-ALL-100-FIXED",
      exportName:name,
      exportDate:dateStr,
      exportTime:timeStr,
      exportDateTime:now.toLocaleString("hu-HU"),
      totalRepos:100,
      totalCount:totalCount,
      repos:allRepos
    };
    downloadFile(JSON.stringify(exportObj,null,2), name);
    setStatus("EXPORT ALL 100 kész: "+totalCount+" db","#0f0");
    setTimeout(()=>alert("Export kész! "+totalCount+" projekt 100 repóból\nFájl: "+name), 300);
  }catch(e){
    alert("Export hiba: "+e.message);
    console.error(e);
  }
}

function importAll100(){
  const input=document.createElement("input");
  input.type="file";
  input.accept=".json,application/json,.txt";
  input.style.display="none";
  document.body.appendChild(input);
  input.onchange=e=>{
    const file=e.target.files[0];
    if(!file){ document.body.removeChild(input); return; }
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        let parsed;
        try{ parsed=JSON.parse(ev.target.result); }catch(err){
          alert("Nem JSON fájl! "+err.message);
          document.body.removeChild(input);
          return;
        }
        let repos=[];
        // Format 1: V12-V26 ALL export {repos:[{repo,data}]}
        if(parsed.repos && Array.isArray(parsed.repos)){
          repos=parsed.repos;
        }
        // Format 2: single repo export {data:[...]}
        else if(parsed.data && Array.isArray(parsed.data)){
          repos=[{repo:currentDB, data:parsed.data}];
        }
        // Format 3: array of projects
        else if(Array.isArray(parsed)){
          repos=[{repo:currentDB, data:parsed}];
        }
        // Format 4: {projects:[...]}
        else if(parsed.projects && Array.isArray(parsed.projects)){
          repos=[{repo:currentDB, data:parsed.projects}];
        }
        // Format 5: single project {name, code}
        else if(parsed.code && parsed.name){
          repos=[{repo:currentDB, data:[parsed]}];
        }
        // Format 6: search any array property that looks like projects
        else{
          let found=false;
          for(let k in parsed){
            if(Array.isArray(parsed[k]) && parsed[k].length>0){
              const first=parsed[k][0];
              if(first && (first.code || first.name || first.fileName)){
                // If k is repos-like but nested
                if(k==="repos" && first.repo){
                  repos=parsed[k];
                  found=true;
                  break;
                }else{
                  repos=[{repo:currentDB, data:parsed[k]}];
                  found=true;
                  break;
                }
              }
              // If array of arrays (old)
              if(Array.isArray(first)){
                let flat=[];
                parsed[k].forEach(sub=>{ if(Array.isArray(sub)) flat=flat.concat(sub); else flat.push(sub); });
                if(flat.length>0 && flat[0].code){
                  repos=[{repo:currentDB, data:flat}];
                  found=true;
                  break;
                }
              }
            }
          }
          if(!found){
            // Last resort: if object has numeric keys 1..100 with arrays
            let collected=[];
            for(let i=1;i<=100;i++){
              if(parsed[i] && Array.isArray(parsed[i]) && parsed[i].length>0){
                collected.push({repo:i, data:parsed[i]});
              }
              if(parsed["NeonRepoV5_LS_"+i] && Array.isArray(parsed["NeonRepoV5_LS_"+i])){
                collected.push({repo:i, data:parsed["NeonRepoV5_LS_"+i]});
              }
            }
            if(collected.length>0){
              repos=collected;
              found=true;
            }
          }
          if(!found){
            console.log("Import parse debug:", parsed);
            alert("Ismeretlen formátum!\nA fájl nem tartalmaz repos vagy data tömböt\n\nTartalom kulcsok: "+Object.keys(parsed).join(", ")+"\nNézd meg F12 konzolt");
            document.body.removeChild(input);
            return;
          }
        }

        const totalToImport=repos.reduce((s,r)=>s+(r.data?r.data.length:0),0);
        if(totalToImport===0){
          alert("A fájl üres, 0 projekt van benne!\nRepos: "+repos.length);
          document.body.removeChild(input);
          return;
        }
        if(!confirm("Importálod mind a 100 repót?\n"+repos.length+" repo, összesen "+totalToImport+" projekt\nEz hozzáadja a meglévőkhöz, nem törli!")){
          document.body.removeChild(input);
          return;
        }
        let totalImported=0;
        repos.forEach(r=>{
          const repoId=r.repo||currentDB;
          const dataArr=r.data||[];
          if(!dataArr.length) return;
          const lsKey="NeonRepoV5_LS_"+repoId;
          try{
            let cur=[];
            try{cur=JSON.parse(localStorage.getItem(lsKey)||"[]");}catch(e){cur=[];}
            dataArr.forEach(it=>{
              if(!it || !it.code) return;
              const newItem={...it};
              if(!newItem.fileName) newItem.fileName=newItem.name||("import_"+Date.now());
              if(!newItem.name) newItem.name=newItem.fileName;
              delete newItem.id;
              newItem.id=Date.now()+Math.floor(Math.random()*100000)+repoId*1000+Math.random()*1000;
              cur.push(newItem);
            });
            localStorage.setItem(lsKey, JSON.stringify(cur));
            totalImported+=dataArr.length;
            try{
              const last=dataArr[dataArr.length-1];
              const lastName=last.fileName||last.name||"";
              if(lastName) localStorage.setItem('NeonRepoV5_LAST_'+repoId, lastName);
            }catch(e){}
          }catch(e){ console.warn(e); }
        });
        document.body.removeChild(input);
        alert("✅ IMPORT MIND A 100 kész!\n"+totalImported+" projekt importálva "+repos.length+" repóba");
        setStatus("IMPORT ALL 100 kész: "+totalImported,"#0f0");
        try{ loadList(); updateAllCounts(); updateTitleWithTotal(); }catch(e){}
        setTimeout(()=>{
          for(let i=1;i<=100;i++){
            try{
              const lastStored=localStorage.getItem('NeonRepoV5_LAST_'+i);
              if(lastStored) updateLastName(i, lastStored);
            }catch(e){}
          }
          try{ loadList(); }catch(e){}
        }, 300);
      }catch(ex){
        alert("Import hiba: "+ex.message);
        console.error(ex);
        try{ document.body.removeChild(input); }catch(e){}
      }
    };
    reader.readAsText(file);
  };
  input.click();
}




// Resizer
(function(){
  const resizer=document.getElementById('resizer');
  const editorSec=document.getElementById('editorSec');
  if(!resizer || !editorSec) return;
  let dragging=false; let startY=0; let startH=0;
  resizer.addEventListener('mousedown', e=>{
    dragging=true; startY=e.clientY; startH=editorSec.offsetHeight;
    document.body.style.cursor='row-resize'; document.body.style.userSelect='none';
    e.preventDefault();
  });
  document.addEventListener('mousemove', e=>{
    if(!dragging) return;
    const dy=e.clientY - startY;
    let newH=startH + dy;
    const total=document.querySelector('.main').offsetHeight;
    if(newH < 80) newH=80;
    if(newH > total - 80) newH=total-80;
    editorSec.style.height=newH+'px';
    editorSec.style.flex='none';
  });
  document.addEventListener('mouseup', ()=>{
    if(dragging){dragging=false; document.body.style.cursor=''; document.body.style.userSelect='';}
  });
})(); setTimeout(()=>{ for(let i=0;i<100;i++){ const el=document.getElementById('last'+i); if(el) fitTextToBox(el); } }, 300);

function updateLastName(id, name){
  try{
    let realColor=window._lastSavedColor || '#00f6ff';
    try{
      const arr=JSON.parse(localStorage.getItem('NeonRepoV5_LS_'+id)||'[]');
      const found=arr.find(x=> (x.fileName===name || x.name===name) );
      if(found && found.color) realColor=found.color;
      else{
        const latest=getLatestProject(arr);
        if(latest && latest.color) realColor=latest.color;
      }
    }catch(e){}
    const el=document.getElementById('last'+(id-1));
    if(el && name){
      el.textContent=name;
      el.title=name+' | '+realColor;
      el.style.display='block';
      el.style.color=realColor;
      el.style.borderColor=realColor;
      el.style.background='rgba(0,0,0,0.4)';
      el.style.boxShadow='0 0 8px '+realColor+'99';
      try{ localStorage.setItem('NeonRepoV5_LAST_'+id, name); localStorage.setItem('NeonRepoV5_LAST_COLOR_'+id, realColor); }catch(e){}
    }
  }catch(e){}
}

function fitTextToBox(el){
  if(!el) return;
  el.style.fontFamily='Arial, sans-serif';
  el.style.fontSize='20px';
  el.style.fontWeight='400';
  el.style.whiteSpace='nowrap';
  el.style.wordBreak='normal';
  el.style.lineHeight='45px';
  el.style.display='inline-block';
  el.style.maxWidth='none';
  el.style.width='auto';
  const box = el.parentElement;
  if(box){
    box.style.width='auto';
    box.style.maxWidth='none';
    box.style.minWidth='max-content';
  }
}
