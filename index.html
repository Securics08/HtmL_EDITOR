<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>5in1-V32-KULON-JSON-NEV-DATUM-IDO-FIX</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
.topbar{height:72px;background:#111;border-bottom:2px solid #222;display:flex;align-items:center;gap:8px;padding:6px 12px;flex-shrink:0;overflow-x:auto}
.topbar button{padding:10px 14px;border-radius:10px;border:2px solid #333;color:#fff;font-weight:bold;cursor:pointer;font-size:11px;white-space:nowrap;flex-shrink:0;transition:0.2s}
.topbar button.menu-btn.active{background:#00ff00!important;color:#000!important;border-color:#00ff00!important;box-shadow:0 0 15px #00ff00!important;transform:scale(1.05);}
.container{height:calc(100vh - 72px);width:100vw;position:relative;background:#000}
iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none;display:none;background:#000}
iframe.active{display:block}
.logo{font-weight:bold;color:#00ff00;margin-right:12px;font-size:13px;font-family:Orbitron,sans-serif;white-space:nowrap;text-shadow:0 0 8px #00ff00;}
.export-btn{background:#00aa00!important;color:#000!important;border:2px solid #00ff00!important;font-size:11px!important;padding:7px 12px!important;font-weight:800!important;margin-left:14px;border-radius:6px!important;}
.export-btn2{background:#002200!important;color:#0f0!important;border:2px solid #0f0!important;font-size:11px!important;padding:7px 12px!important;font-weight:800!important;border-radius:6px!important;}
.import-btn{background:#001a44!important;color:#88bbff!important;border:2px solid #0033aa!important;font-size:11px!important;padding:7px 12px!important;font-weight:800!important;border-radius:6px!important;}
.reset-all-btn{background:#440000!important;color:#ff6666!important;border:2px solid #ff0000!important;font-size:11px!important;padding:7px 12px!important;font-weight:900!important;border-radius:6px!important;}
#exportModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:9999;justify-content:center;align-items:center;} #exportModal.show{display:flex;}
.modal-box{background:#0c0c0c;border:3px solid #00ff00;border-radius:16px;padding:24px;width:560px;max-width:95%;box-shadow:0 0 20px #00ff00;}
.modal-box h2{color:#00ff00;margin:0 0 12px 0;font-family:Orbitron,sans-serif;text-align:center;font-size:18px;}
.modal-box input{width:100%;padding:12px;border-radius:8px;border:2px solid #00ff00;background:#000;color:#00ff00;font-size:14px;font-weight:bold;margin-bottom:14px;outline:none;}
.modal-actions{display:flex;gap:10px;} .modal-actions button{flex:1;padding:10px;border-radius:8px;border:2px solid;font-weight:bold;cursor:pointer;}
.btn-modal-save{background:#00ff00;color:#000;border-color:#00ff00!important;} .btn-modal-cancel{background:#222;color:#fff;border-color:#555!important;}
.status{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#111;border:2px solid #00ff00;padding:10px 20px;border-radius:8px;color:#00ff00;font-weight:bold;z-index:10000;display:none;max-width:95%;text-align:center;font-size:12px;white-space:pre-line;} .status.show{display:block;}
#resetModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);z-index:10001;justify-content:center;align-items:center;} #resetModal.show{display:flex;}
.reset-box{background:#1a0000;border:3px solid #ff0000;border-radius:16px;padding:24px;width:480px;max-width:90%;text-align:center;}
.debug{position:fixed;top:74px;left:10px;background:#000;border:2px solid #0f0;color:#0f0;padding:8px 12px;font-size:11px;z-index:9998;max-height:380px;overflow:auto;width:560px;display:none;font-family:monospace;white-space:pre-wrap;} .debug.show{display:block;}
.cyan-cnt{color:#00ffff!important;background:#002222;border:1.5px solid #00ffff;border-radius:8px;padding:4px 10px;font-size:16px;font-weight:900;margin-right:8px;min-width:32px;display:inline-block;text-align:center;line-height:1;}
.topbar button.menu-btn.active .cyan-cnt{color:#000!important;background:#00ffff!important;border-color:#00ffff!important;}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">5in1-V32-KULON-JSON-NEV-DATUM-IDO-FIX</div>
  <button class="menu-btn active" id="btn0" onclick="showTab(0)"><span class="cyan-cnt" id="cnt0">0</span>1. Neon Repo</button>
  <button class="menu-btn" id="btn1" onclick="showTab(1)"><span class="cyan-cnt" id="cnt1">0</span>2. OCR Teljes</button>
  <button class="menu-btn" id="btn2" onclick="showTab(2)"><span class="cyan-cnt" id="cnt2">0</span>3. Végtelen</button>
  <button class="menu-btn" id="btn3" onclick="showTab(3)"><span class="cyan-cnt" id="cnt3">0</span>4. ULTRA</button>
  <button class="menu-btn" id="btn4" onclick="showTab(4)"><span class="cyan-cnt" id="cnt4">0</span>5. Vault</button>
  <div style="margin-left:auto;display:flex;gap:8px;align-items:center;">
    <button class="export-btn" onclick="openExportModal()">💾 EXPORT</button>
    <button class="export-btn2" onclick="doExportSeparate()">📦 KÜLÖN JSON</button>
    <button class="import-btn" onclick="triggerImport()">📥 IMPORT</button>
    <button class="reset-all-btn" onclick="openResetModal()">💥 RESET</button>
    <button onclick="document.getElementById('debug').classList.toggle('show')" style="background:#222!important;font-size:10px;padding:5px 8px!important;color:#888!important;">DEBUG</button>
  </div>
</div>
<div class="container">
  <iframe id="f0" class="active"></iframe>
  <iframe id="f1"></iframe>
  <iframe id="f2"></iframe>
  <iframe id="f3"></iframe>
  <iframe id="f4"></iframe>
</div>

<div id="exportModal">
  <div class="modal-box">
    <h2>💾 EXPORT V32 FIX</h2>
    <p style="color:#0f0;font-size:11px;text-align:center;">V32 KÜLÖN JSON • Név+Dátum+Idő • Véletlen színek • Aktív zöld • Számláló FIX</p>
    <div style="display:flex;gap:12px;margin-bottom:10px;justify-content:center;">
      <label style="color:#0f0;font-size:12px;display:flex;align-items:center;gap:4px"><input type="radio" name="expMode" value="all" checked> Egyben (5in1)</label>
      <label style="color:#0ff;font-size:12px;display:flex;align-items:center;gap:4px"><input type="radio" name="expMode" value="sep"> Külön (5db JSON)</label>
    </div>
    <input id="exportNameInput" type="text" autocomplete="off" placeholder="Export név..."/>
    <div class="modal-actions"><button class="btn-modal-cancel" onclick="closeExportModal()">MÉGSE</button><button class="btn-modal-save" onclick="doExport()">MENTÉS</button></div>
    <div id="exportDebug" style="color:#0f0;font-size:10px;margin-top:10px;max-height:200px;overflow:auto;background:#000;padding:8px;border-radius:4px;border:1px solid #0f0;white-space:pre-wrap;"></div>
  </div>
</div>

<div id="resetModal">
  <div class="reset-box">
    <h2 style="color:#f00;">💥 RESET V32</h2>
    <p style="color:#ffaaaa;font-size:13px;">Minden modul adata törlődik (IndexedDB). A menük megmaradnak.</p>
    <div class="modal-actions" style="margin-top:16px;"><button class="btn-modal-cancel" onclick="closeResetModal()">MÉGSE</button><button class="btn-modal-save" onclick="doResetAllData()" style="background:#f00;color:#fff;border-color:#f00!important;">IGEN, TÖRÖL</button></div>
  </div>
</div>

<div id="status" class="status"></div>
<div id="debug" class="debug"></div>
<input type="file" id="importFileInput" accept=".json" multiple style="display:none"/>

<script>
const MODULES = [
  {id:0, name:"1_Neon_Repo", title:"Neon Repo", db:"NeonRepoV5", color:"#00f6ff"},
  {id:1, name:"2_OCR_Teljes", title:"OCR Teljes", db:"OCRDBV5", color:"#ffaa00"},
  {id:2, name:"3_Vegtelen", title:"Végtelen", db:"VegtelenV5", color:"#ff00ff"},
  {id:3, name:"4_ULTRA", title:"ULTRA", db:"UltraV5", color:"#ffff00"},
  {id:4, name:"5_Vault", title:"Vault", db:"VaultV5", color:"#00ff88"}
];
let exportBuffer = {}; // moduleId -> data
let pendingExports = 0;

function logDebug(m){
  const el=document.getElementById('debug');
  const t=new Date().toLocaleTimeString();
  el.textContent = `[${t}] ${m}\n` + el.textContent.slice(0,8000);
}

function makeModuleHTML(mod){
  return `<!DOCTYPE html>
<html lang="hu"><head><meta charset="UTF-8"><style>
body{margin:0;background:#050505;color:#fff;font-family:'Segoe UI',sans-serif;display:flex;height:100vh;overflow:hidden}
.sidebar{width:340px;background:#0a0a0a;border-right:2px solid #222;display:flex;flex-direction:column;padding:16px}
.main{flex:1;display:flex;flex-direction:column;background:#000}
h2{color:${mod.color};text-shadow:0 0 10px ${mod.color};font-size:18px;margin:0 0 10px 0;text-align:center;letter-spacing:1px}
.storage{font-size:11px;color:${mod.color};font-weight:bold;margin-bottom:6px}
.bar{width:100%;height:8px;background:#111;border-radius:4px;overflow:hidden;margin-bottom:12px;border:1px solid #333}
#fill{height:100%;width:0%;background:linear-gradient(90deg,${mod.color},#fff);box-shadow:0 0 8px ${mod.color};transition:0.5s}
input,textarea,button{background:#161616;color:#fff;border:1px solid #333;padding:10px;border-radius:8px;outline:none;margin-bottom:8px;font-size:13px}
textarea{flex:1;width:100%;resize:none;font-family:Consolas,monospace;color:#0f0;font-size:13px;background:#000;border:1px solid #0f04;line-height:1.5}
.toolbar{display:flex;gap:6px;margin-bottom:6px}
button{cursor:pointer;font-weight:bold;font-size:11px;flex:1;border:1px solid transparent;transition:0.2s;text-transform:uppercase}
button:hover{filter:brightness(1.3);transform:scale(1.02)}
.btn-save{background:${mod.color};color:#000;box-shadow:0 0 10px ${mod.color}66}
.btn-copy{background:#0088ff;border-color:#00ccff}
.btn-del{background:#aa0000;border-color:#ff4444}
.btn-run{background:#0f0;color:#000;font-size:14px;flex:2;box-shadow:0 0 15px #0f08}
.btn-imp{background:#d47a00;border-color:#ff9d00}
.btn-exp{background:#7a00d4;border-color:#a600ff}
#fileList{flex:1;overflow-y:auto;padding-right:4px;margin-top:8px}
.file-item{padding:12px;margin-bottom:8px;background:#141414;border-radius:8px;cursor:pointer;border:1px solid #222;transition:0.2s;position:relative;overflow:hidden;border-left:5px solid ${mod.color}}
.file-item:hover{background:#1c1c1c;transform:translateX(4px)}
.file-item.active{background:#222;border-color:${mod.color}88}
.file-item strong{display:block;font-size:13px;margin-bottom:4px}
.file-item small{color:#888;font-size:10px;font-family:monospace}
.editor-sec{height:45%;display:flex;flex-direction:column;padding:8px;border-bottom:2px solid #333;background:#000}
.preview-sec{height:55%;display:flex;flex-direction:column;background:#fff}
.preview-head{background:#0a0a0a;color:#0f0;padding:6px 16px;font-size:11px;font-weight:bold;border-bottom:1px solid #333}
iframe.preview{flex:1;border:none;background:#fff}
.reset{margin-top:8px;background:#440000;font-size:10px;opacity:0.7}
</style></head><body>
<div class="sidebar">
<h2>⚡ ${mod.title.toUpperCase()} - V32</h2>
<div class="storage">TÁRHELY: <span id="stTxt">0 MB / 500 MB</span></div><div class="bar"><div id="fill"></div></div>
<input type="text" id="fileName" placeholder="Projekt neve...">
<div class="toolbar"><button class="btn-save" onclick="saveToDB()">MENTÉS</button><button onclick="newProj()">ÚJ</button><button class="btn-del" onclick="deleteFromDB()">TÖRLÉS</button></div>
<div id="fileList"></div>
<div class="toolbar"><button class="btn-imp" onclick="importData()">IMPORT</button><button class="btn-exp" onclick="exportData()">EXPORT</button></div>
<button class="reset" onclick="clearAll()">RENDSZER RESET (TELJES)</button>
<div style="font-size:9px;color:#444;margin-top:6px;text-align:center">ID: ${mod.db} • V32 FIX • NÉV+DÁTUM+IDŐ</div>
</div>
<div class="main">
<div class="editor-sec"><div class="toolbar"><span style="color:#ffff00;font-size:11px;padding-top:8px;font-weight:bold">KÓDSZERKESZTŐ</span><button class="btn-copy" onclick="copyCode()">KÓD MÁSOLÁSA ✨</button><button class="btn-run" onclick="runCode()">▶ FUTTATÁS 🚀</button></div>
<textarea id="editor" spellcheck="false" placeholder="Ide írd a HTML kódot..."></textarea></div>
<div class="preview-sec"><div class="preview-head">ELŐNÉZET</div><iframe id="preview" class="preview"></iframe></div>
</div>
<script>
let db; let activeId=null;
const neonColors=["#00f6ff","#0f0","#f0f","#ff0","#f40","#08f"];
const DB_NAME="${mod.db}"; const STORE="projects";
const MOD_ID=${mod.id}; const MOD_NAME="${mod.name}";
const req=indexedDB.open(DB_NAME,1);
req.onupgradeneeded=e=>{db=e.target.result; db.createObjectStore(STORE,{keyPath:"id",autoIncrement:true});};
req.onsuccess=e=>{db=e.target.result; loadList();};
req.onerror=()=>{console.error("DB hiba")};

function copyCode(){
 const ed=document.getElementById("editor"); ed.select(); document.execCommand("copy");
 const b=document.querySelector(".btn-copy"); const t=b.innerText; b.innerText="MÁSOLVA! ✓"; b.style.background="#00ff88"; setTimeout(()=>{b.innerText=t; b.style.background="#0088ff";},1200);
}
function downloadFile(content,fileName){
 const blob=new Blob([content],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=fileName; a.click(); URL.revokeObjectURL(a.href);
}
function saveToDB(){
 if(!db) return;
 const name=document.getElementById("fileName").value.trim() || "Névtelen_"+Date.now();
 const code=document.getElementById("editor").value;
 const color=neonColors[Math.floor(Math.random()*neonColors.length)];
 const tx=db.transaction(STORE,"readwrite"); const store=tx.objectStore(STORE);
 const data={name,code,color,time:new Date().toLocaleString("hu-HU")};
 if(activeId) data.id=activeId;
 store.put(data).onsuccess=e=>{
  activeId=activeId||e.target.result;
  loadList();
  const now=new Date(); const pad=n=>String(n).padStart(2,'0');
  const dateStr=now.getFullYear()+"-"+pad(now.getMonth()+1)+"-"+pad(now.getDate());
  const timeStr=pad(now.getHours())+"-"+pad(now.getMinutes())+"-"+pad(now.getSeconds());
  const finalName=MOD_NAME+"_"+name.replace(/\\s+/g,'_')+"_"+dateStr+"_"+timeStr+".json";
  downloadFile(JSON.stringify(data,null,2),finalName);
 };
}
function loadList(){
 if(!db) return;
 const tx=db.transaction(STORE,"readonly");
 tx.objectStore(STORE).getAll().onsuccess=e=>{
  const list=document.getElementById("fileList"); list.innerHTML=""; let size=0;
  e.target.result.forEach(item=>{
   size+=new Blob([item.code]).size;
   const div=document.createElement("div"); div.className="file-item"+(activeId===item.id?" active":"");
   div.style.borderLeftColor=item.color; div.innerHTML="<strong style='color:"+item.color+"'>"+item.name+"</strong><small>"+item.time+"</small>";
   div.onclick=()=>{activeId=item.id; document.getElementById("fileName").value=item.name; document.getElementById("editor").value=item.code; loadList(); runCode();};
   list.appendChild(div);
  });
  const mb=(size/(1024*1024)).toFixed(2); document.getElementById("stTxt").innerText=mb+" MB / 500 MB";
  document.getElementById("fill").style.width=Math.min((size/(500*1024*1024))*100,100)+"%";
  parent.postMessage({type:"count", module:MOD_ID, count:e.target.result.length, moduleName:MOD_NAME},"*");
  parent.postMessage({type:"debug", msg:MOD_NAME+": "+e.target.result.length+" db"},"*");
 };
}
function runCode(){
 const code=document.getElementById("editor").value;
 const blob=new Blob([code],{type:'text/html'}); document.getElementById("preview").src=URL.createObjectURL(blob);
}
function newProj(){activeId=null; document.getElementById("fileName").value=""; document.getElementById("editor").value=""; document.getElementById("preview").src="about:blank"; loadList();}
function deleteFromDB(){ if(!activeId || !confirm("Törlöd?")) return; db.transaction(STORE,"readwrite").objectStore(STORE).delete(activeId).onsuccess=newProj; }
function exportData(){
 const now=new Date(); const pad=n=>String(n).padStart(2,'0');
 const dateStr=now.getFullYear()+"-"+pad(now.getMonth()+1)+"-"+pad(now.getDate());
 const timeStr=pad(now.getHours())+":"+pad(now.getMinutes())+":"+pad(now.getSeconds());
 const timeFile=pad(now.getHours())+"-"+pad(now.getMinutes())+"-"+pad(now.getSeconds());
 let name=prompt("Export név:", MOD_NAME+"_Export_"+dateStr+"_"+timeFile); if(!name) return;
 db.transaction(STORE,"readonly").objectStore(STORE).getAll().onsuccess=e=>{
  const exportObj={version:"V32-KULON-JSON-FIX", module:MOD_NAME, moduleId:MOD_ID, exportName:name, exportDate:dateStr, exportTime:timeStr, exportTimeFile:timeFile, exportDateTime:now.toLocaleString("hu-HU"), exportTimestamp:now.getTime(), count:e.target.result.length, data:e.target.result};
  downloadFile(JSON.stringify(exportObj,null,2), (name.endsWith(".json")?name:name+".json"));
 };
}
function importData(){
 const input=document.createElement("input"); input.type="file"; input.accept=".json";
 input.onchange=e=>{
  const reader=new FileReader(); reader.onload=ev=>{
   try{
    const parsed=JSON.parse(ev.target.result); let arr=null;
    if(parsed.data) arr=parsed.data; else if(parsed.modules && parsed.modules[MOD_NAME]) arr=parsed.modules[MOD_NAME].data||parsed.modules[MOD_NAME]; else if(Array.isArray(parsed)) arr=parsed; else arr=[parsed];
    const tx=db.transaction(STORE,"readwrite"); const store=tx.objectStore(STORE);
    (Array.isArray(arr)?arr:[arr]).forEach(it=>{delete it.id; store.put(it);});
    tx.oncomplete=()=>loadList();
   }catch(err){alert("Import hiba: "+err.message);}
  }; reader.readAsText(e.target.files[0]);
 }; input.click();
}
function clearAll(){ if(confirm("Minden törlődik! Biztos?")) db.transaction(STORE,"readwrite").objectStore(STORE).clear().onsuccess=newProj; }

// Parent messages
window.addEventListener("message", (e)=>{
 if(e.data.type==="exportRequest"){
   if(!db) return;
   db.transaction(STORE,"readonly").objectStore(STORE).getAll().onsuccess=ev=>{
     parent.postMessage({type:"exportData", module:MOD_ID, moduleName:MOD_NAME, data:ev.target.result},"*");
   };
 }
 if(e.data.type==="importData"){
   try{
     const items=e.data.payload; const tx=db.transaction(STORE,"readwrite"); const store=tx.objectStore(STORE);
     (Array.isArray(items)?items:[items]).forEach(it=>{delete it.id; store.put(it);});
     tx.oncomplete=()=>loadList();
   }catch(err){}
 }
 if(e.data.type==="resetRequest"){
   db.transaction(STORE,"readwrite").objectStore(STORE).clear().onsuccess=newProj;
 }
});
<\/script></body></html>
`;
}

function initIframes(){
  MODULES.forEach(m=>{
    const html = makeModuleHTML(m);
    const iframe = document.getElementById('f'+m.id);
    iframe.srcdoc = html;
  });
}

function showTab(idx){
  for(let i=0;i<5;i++){
    document.getElementById('f'+i).classList.remove('active');
    document.getElementById('btn'+i).classList.remove('active');
  }
  document.getElementById('f'+idx).classList.add('active');
  document.getElementById('btn'+idx).classList.add('active');
  logDebug(`Tab váltás -> ${idx} ${MODULES[idx].name}`);
}

// Parent export/import/reset
function openExportModal(){
  const now=new Date(); const pad=n=>String(n).padStart(2,'0');
  const dateStr = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
  const timeStr = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  const timeFile = `${pad(now.getHours())}-${pad(now.getMinutes())}-${pad(now.getSeconds())}`;
  const defName = `5in1_Export_${dateStr}_${timeFile}`;
  document.getElementById('exportNameInput').value = defName;
  document.getElementById('exportDebug').textContent = `Dátum: ${dateStr}\nIdő: ${timeStr}\nModulok: 5\nDarabok: ${[0,1,2,3,4].map(i=>document.getElementById('cnt'+i).textContent).join(' | ')}`;
  document.getElementById('exportModal').classList.add('show');
}
function closeExportModal(){ document.getElementById('exportModal').classList.remove('show'); }
function openResetModal(){ document.getElementById('resetModal').classList.add('show'); }
function closeResetModal(){ document.getElementById('resetModal').classList.remove('show'); }

function showStatus(msg,color='#00ff00',dur=6000){
  const el=document.getElementById('status');
  el.textContent=msg; el.style.borderColor=color; el.style.color=color;
  el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),dur);
}

function requestAllExports(){
  exportBuffer={};
  pendingExports=5;
  MODULES.forEach(m=>{
    document.getElementById('f'+m.id).contentWindow.postMessage({type:'exportRequest'},'*');
  });
}

function doExport(){
  const mode = document.querySelector('input[name="expMode"]:checked').value;
  const nameInput = document.getElementById('exportNameInput').value.trim() || `5in1_Export_${Date.now()}`;
  closeExportModal();
  if(mode==='sep'){
    doExportSeparate(nameInput);
    return;
  }
  // egyben
  showStatus('⏳ Adatok gyűjtése 5 modulból...','#00ffff',3000);
  requestAllExports();
  const start = Date.now();
  const checker = setInterval(()=>{
    if(Object.keys(exportBuffer).length===5 || Date.now()-start>5000){
      clearInterval(checker);
      const now=new Date(); const pad=n=>String(n).padStart(2,'0');
      const dateStr=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
      const timeStr=`${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      const timeFile=`${pad(now.getHours())}-${pad(now.getMinutes())}-${pad(now.getSeconds())}`;
      const exportObj={
        version:"V32-KULON-JSON-5in1-FIX",
        exportName:nameInput,
        exportDate:dateStr,
        exportTime:timeStr,
        exportTimeFile:timeFile,
        exportDateTime:now.toLocaleString('hu-HU'),
        exportTimestamp:now.getTime(),
        modules:{}
      };
      let total=0;
      MODULES.forEach(m=>{
        const data=exportBuffer[m.id]||[];
        exportObj.modules[m.name]={
          module:m.name,
          moduleId:m.id,
          title:m.title,
          count:data.length,
          data:data
        };
        total+=data.length;
      });
      exportObj.totalCount=total;
      const blob=new Blob([JSON.stringify(exportObj,null,2)],{type:'application/json'});
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
      a.download=(nameInput.endsWith('.json')?nameInput:nameInput+'.json'); a.click();
      showStatus(`✔ EGYBEN EXPORT KÉSZ!\nNév: ${nameInput}\nDátum: ${dateStr} ${timeStr}\nÖssz: ${total} db`,'#00ff00',7000);
      logDebug(`Egyben export: ${nameInput} total=${total}`);
    }
  },200);
}

function doExportSeparate(customName){
  const now=new Date(); const pad=n=>String(n).padStart(2,'0');
  const dateStr=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
  const timeStr=`${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  const timeFile=`${pad(now.getHours())}-${pad(now.getMinutes())}-${pad(now.getSeconds())}`;
  const baseName = customName || document.getElementById('exportNameInput').value.trim() || `5in1_KULON_${dateStr}_${timeFile}`;
  closeExportModal();
  showStatus('⏳ Külön JSON-ok gyűjtése...','#00ffff',3000);
  requestAllExports();
  const start=Date.now();
  const checker=setInterval(()=>{
    if(Object.keys(exportBuffer).length===5 || Date.now()-start>5000){
      clearInterval(checker);
      MODULES.forEach(m=>{
        const data=exportBuffer[m.id]||[];
        const obj={
          version:`V32-KULON-JSON-${m.name}`,
          module:m.name,
          moduleId:m.id,
          moduleName:m.title,
          exportName:`${baseName}_${m.name}`,
          exportDate:dateStr,
          exportTime:timeStr,
          exportTimeFile:timeFile,
          exportDateTime:now.toLocaleString('hu-HU'),
          exportTimestamp:now.getTime(),
          count:data.length,
          data:data
        };
        const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});
        const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
        a.download=`${baseName}_${m.name}_${dateStr}_${timeFile}.json`; a.click();
      });
      showStatus(`✔ KÜLÖN JSON EXPORT KÉSZ!\nBase: ${baseName}\nDátum: ${dateStr} ${timeStr}\n5 fájl letöltve`,'#00ffff',7000);
      logDebug(`Külön export: ${baseName} 5 fájl`);
    }
  },250);
}

function triggerImport(){
  document.getElementById('importFileInput').click();
}

document.getElementById('importFileInput').addEventListener('change', async (e)=>{
  const files=Array.from(e.target.files); if(!files.length) return;
  for(const file of files){
    try{
      const text=await file.text(); const parsed=JSON.parse(text);
      // 5in1 format
      if(parsed.modules){
        Object.keys(parsed.modules).forEach(key=>{
          const modEntry=parsed.modules[key];
          const targetMod=MODULES.find(m=>m.name===key || m.title===key || key.includes(m.name));
          const mId = targetMod ? targetMod.id : MODULES.find(m=>key.toLowerCase().includes(m.name.toLowerCase().split('_')[1]))?.id;
          const data = modEntry.data || modEntry.notes || modEntry;
          const destId = targetMod ? targetMod.id : (mId!==undefined?mId:null);
          if(destId!==null && destId!==undefined){
            document.getElementById('f'+destId).contentWindow.postMessage({type:'importData', payload:data},'*');
          } else {
            // if can't detect, import to all
            MODULES.forEach(m=>{document.getElementById('f'+m.id).contentWindow.postMessage({type:'importData', payload:data},'*');});
          }
        });
        showStatus(`✔ 5in1 IMPORT: ${file.name}`,'#00ff00',5000);
      } else {
        // single module
        let data = parsed.data || parsed.notes || parsed;
        let targetName = parsed.module || parsed.moduleName || '';
        let target = MODULES.find(m=>targetName.includes(m.name) || targetName===m.title);
        if(!target && parsed.version && parsed.version.includes('Neon')) target=MODULES[0];
        if(!target) target=MODULES[0];
        if(file.name.includes('Neon')) target=MODULES[0];
        if(file.name.includes('OCR')) target=MODULES[1];
        if(file.name.includes('Vegtelen')||file.name.includes('Végtelen')) target=MODULES[2];
        if(file.name.includes('ULTRA')) target=MODULES[3];
        if(file.name.includes('Vault')) target=MODULES[4];
        document.getElementById('f'+target.id).contentWindow.postMessage({type:'importData', payload:data},'*');
        showStatus(`✔ IMPORT: ${file.name} -> ${target.title}`,'#00ff00',5000);
      }
    }catch(err){ showStatus('❌ Import hiba: '+file.name+' '+err.message,'#ff0000',5000); }
  }
  e.target.value='';
});

function doResetAllData(){
  MODULES.forEach(m=>{
    document.getElementById('f'+m.id).contentWindow.postMessage({type:'resetRequest'},'*');
  });
  setTimeout(()=>{
    MODULES.forEach(m=>{document.getElementById('cnt'+m.id).textContent='0';});
    showStatus('💥 MINDEN MODUL RESETELVE','#ff6666',4000);
    logDebug('RESET ALL');
  },500);
  closeResetModal();
}

window.addEventListener('message', (e)=>{
  if(e.data.type==='count'){
    const id=e.data.module;
    if(document.getElementById('cnt'+id)){
      document.getElementById('cnt'+id).textContent=e.data.count;
      // random color for menu btn inactive
      if(!document.getElementById('btn'+id).classList.contains('active')){
        const colors=["#00f6ff","#ffaa00","#ff00ff","#ffff00","#00ff88","#ff4400","#00ff00"];
        const c=colors[id%colors.length];
        document.getElementById('btn'+id).style.borderColor=c+'66';
        document.getElementById('btn'+id).style.color=c;
      }
    }
  }
  if(e.data.type==='exportData'){
    exportBuffer[e.data.module]=e.data.data;
  }
  if(e.data.type==='debug'){
    logDebug(e.data.msg);
  }
});

window.addEventListener('DOMContentLoaded', initIframes);
</script>
