<script>
  const editor = document.getElementById("editor"); const editorHeader = document.getElementById("editorHeader"); const captureArea = document.getElementById("captureArea"); const savedList = document.getElementById("savedList"); const storageInfo = document.getElementById("storageInfo"); const storageBarFill = document.getElementById("storageBarFill"); const linkInput = document.getElementById("linkInput"); const glowBtn = document.getElementById("glowBtn"); const lastFileDisplay = document.getElementById("lastFileDisplay"); const timeDisplay = document.getElementById("timeDisplay"); let activeColorClass = "neon-white"; let glowOn = false; let notes = []; let currentOpenId = null; let currentOpenName = null;
  let db; const dbRequest = indexedDB.open("NeonNotesDB", 1);
  dbRequest.onupgradeneeded = e => { db = e.target.result; db.createObjectStore("notes", { keyPath: "id", autoIncrement: true }); };
  dbRequest.onsuccess = e => { db = e.target.result; loadFromDB(); };
  function loadFromDB() { const transaction = db.transaction("notes", "readonly"); const store = transaction.objectStore("notes"); const request = store.getAll(); request.onsuccess = () => { notes = request.result; refreshListUI(); updateStorageStatus(); }; }
  function updateStorageStatus() {
    const totalMax = 500 * 1024 * 1024; let size = new Blob([JSON.stringify(notes)]).size;
    const freePercentage = Math.max(0, 100 - ((size / totalMax) * 100)).toFixed(2); const usedMB = (size / (1024 * 1024)).toFixed(2);
    storageBarFill.style.width = (100 - freePercentage) + "%"; storageBarFill.style.background = freePercentage < 10 ? "#ff0000" : "#00ff00";
    storageInfo.innerHTML = `<span class="label-red">Használt:</span> <span class="label-cyan">${usedMB} MB</span> / 500 MB`;
    const freeMB = ((totalMax - size) / (1024 * 1024)).toFixed(2);
    document.getElementById("freeMemoryDisplay").innerHTML = `<span class="label-red">Szabad memória:</span> <span class="label-cyan">${freeMB} MB</span>`;
    const badge = document.getElementById("noteCountBadge"); if(badge) badge.textContent = notes.length;
  }
  // --- ÚJ: SOR SZÁMLÁLÓ MAGENTA ---
  function updateLineCount(){
    const badge = document.getElementById("lineCountBadge");
    const badgeChars = document.getElementById("charCountBadge");
    if(!badge) return;
    const text = editor.innerText || "";
    if(text.trim() === ""){
      badge.textContent = "0 sor";
      if(badgeChars) badgeChars.textContent = "0 char";
      return;
    }
    let lines = 0;
    const divs = editor.querySelectorAll("div");
    if(divs.length>0){
      lines = divs.length;
      const firstChild = editor.firstChild;
      if(firstChild && firstChild.nodeType===3 && firstChild.textContent.trim()!==''){
        lines++;
      }
    }else{
      lines = text.split("\n").length;
    }
    if(lines===0 && text.length>0) lines=1;
    badge.textContent = lines + " sor";
    // pulse
    badge.classList.add('pulse');
    setTimeout(()=>badge.classList.remove('pulse'),400);
    if(badgeChars){
      const chars = text.length;
      const words = text.trim().split(/\s+/).filter(w=>w.length>0).length;
      badgeChars.textContent = chars + " char | " + words + " szó";
    }
  }

  const lineObserver = new MutationObserver(updateLineCount);
  lineObserver.observe(document.getElementById("editor"), { childList:true, subtree:true, characterData:true });

  editor.addEventListener("mousedown", function(e) { const link = e.target.closest("a"); if (link) { window.open(link.href, "_blank"); } });
  function setRecordedTime(ts) { timeDisplay.innerHTML = `<span class="label-red">Időpont:</span> <span class="label-cyan">${ts || "--:--:--"}</span>`; }
  function hardReset() { if(confirm("Törli a memóriát?")) { const t = db.transaction("notes", "readwrite"); t.objectStore("notes").clear(); t.oncomplete = () => { notes = []; refreshListUI(); updateStorageStatus(); setRecordedTime(""); lastFileDisplay.innerHTML = `<span class="label-red">Utolsó fájl:</span> <span class="label-green">Nincs mentés</span>`; editor.innerHTML=""; updateLineCount(); alert("Resetelve!"); }; } }
  function refreshListUI() { savedList.innerHTML = ""; notes.forEach(n => addSavedItemToUI(n)); const badge = document.getElementById("noteCountBadge"); if(badge){ const prev = parseInt(badge.textContent)||0; badge.textContent = notes.length; if(notes.length>prev){ badge.classList.add("pulse"); setTimeout(()=>badge.classList.remove("pulse"),600); } } }
  function toggleGlow(){ glowOn = !glowOn; document.body.classList.toggle("glow-off", !glowOn); glowBtn.innerText = glowOn ? "Glow ON" : "Glow OFF"; glowBtn.className = glowOn ? "on" : "off"; }
  function toggleTheme() { document.body.classList.toggle("light-mode"); }
  function applyColorAndSet(e, className) { e.preventDefault(); activeColorClass = className; const selection = window.getSelection(); if (selection.rangeCount > 0) { let container = selection.anchorNode; if (container.nodeType === 3) container = container.parentElement; const closestLink = container.closest("a"); if (closestLink) { closestLink.className = className; } else if (selection.toString().length > 0) { const range = selection.getRangeAt(0); const span = document.createElement("span"); span.className = className; span.textContent = selection.toString(); range.deleteContents(); range.insertNode(span); } } editor.focus(); setTimeout(updateLineCount,10); }
  function resetColor(){ activeColorClass = "neon-white"; }
  function setFont(){ editor.style.fontFamily = document.getElementById("fontSelect").value; }
  function setSize(size){ editor.style.fontSize = size + "px"; document.getElementById("sizeValue").innerText = size; }
  function insertHTMLAtCursor(html){ const sel=window.getSelection(); if(!sel.rangeCount) return; const range=sel.getRangeAt(0); range.deleteContents(); const el=document.createElement("div"); el.innerHTML=html; const frag=document.createDocumentFragment(); let node,lastNode; while((node=el.firstChild)) lastNode=frag.appendChild(node); range.insertNode(frag); if(lastNode){ range.setStartAfter(lastNode); range.collapse(true); sel.removeAllRanges(); sel.addRange(range); } setTimeout(updateLineCount,10); }
  function insertHTMLPrompt() { const htmlCode = prompt("Másold be ide a beillesztendő HTML kódot:"); if(htmlCode) { const span = document.createElement("span"); span.className = activeColorClass; span.textContent = htmlCode; editor.appendChild(span); editor.appendChild(document.createElement("br")); editor.scrollTop = editor.scrollHeight; setTimeout(updateLineCount,10); } }
  editor.addEventListener("keydown", e => {
    if(e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey){ const selection = window.getSelection(); let container = selection.anchorNode.parentElement; if (container && (container.tagName === "A" || container.closest("a"))) return; e.preventDefault(); if(container && container.classList.contains(activeColorClass) && container.tagName === "SPAN") { const textNode = document.createTextNode(e.key === " " ? "\u00A0" : e.key); const range = selection.getRangeAt(0); range.insertNode(textNode); range.setStartAfter(textNode); range.collapse(true); } else { let char = e.key === " " ? "&nbsp;" : e.key; insertHTMLAtCursor(`<span class="${activeColorClass}">${char}</span>`); } } else if(e.key === "Enter"){ e.preventDefault(); insertHTMLAtCursor("<div><br></div>"); setTimeout(updateLineCount,10); }
  });
  editor.addEventListener("paste", e => {
    e.preventDefault(); const text = (e.clipboardData || window.clipboardData).getData("text/plain"); const fragment = document.createDocumentFragment(); const urlPattern = /(https?:\/\/[^\s]+)/gi; const lines = text.split(/\r?\n/);
    lines.forEach((line) => { const lineDiv = document.createElement("div"); let currentLineHTML = ""; let lastIdx = 0; let match; while ((match = urlPattern.exec(line)) !== null) { const before = line.substring(lastIdx, match.index); if (before) currentLineHTML += `<span class="${activeColorClass}">${before.replace(/ /g, "&nbsp;")}</span>`; currentLineHTML += `<a href="${match[0]}" target="_blank" class="${activeColorClass}">${match[0]}</a>`; lastIdx = urlPattern.lastIndex; } const after = line.substring(lastIdx); if (after) currentLineHTML += `<span class="${activeColorClass}">${after.replace(/ /g, "&nbsp;")}</span>`; lineDiv.innerHTML = currentLineHTML || "<br>"; fragment.appendChild(lineDiv); });
    const sel = window.getSelection(); if (!sel.rangeCount) return; const range = sel.getRangeAt(0); range.deleteContents(); range.insertNode(fragment); setTimeout(updateLineCount,50);
  });
  function getFormattedDate() { const d = new Date(); return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}_${String(d.getHours()).padStart(2,'0')}-${String(d.getMinutes()).padStart(2,'0')}`; }
  function askHeaderInfo() { const intro = prompt("Bevezető:", editorHeader.innerText.split(" - ")[0] || ""); if(intro===null) return false; const name = prompt("Jegyzet neve:", editorHeader.innerText.split(" - ")[1] || ""); if(!name) return false; const d = new Date(); const timestamp = `${d.getFullYear()}. ${String(d.getMonth()+1).padStart(2,'0')}. ${String(d.getDate()).padStart(2,'0')}. ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`; editorHeader.innerHTML = `<span class="${activeColorClass}">${intro} - ${name} - ${timestamp}</span>`; setRecordedTime(timestamp); return true; }
  function saveNote(){ if(!askHeaderInfo()) return; const headerText = editorHeader.innerText; const parts = headerText.split(" - "); const intro = parts[0], namePart = parts[1], timestamp = parts[2]; const fileName = `Jegyzet_${namePart}_${getFormattedDate()}.json`; const data = { name: namePart, intro, timestamp, content: editor.innerHTML, color: activeColorClass, font: editor.style.fontFamily, size: editor.style.fontSize }; const t = db.transaction("notes", "readwrite"); const store = t.objectStore("notes"); const req = store.put(data); req.onsuccess = (e)=>{ currentOpenId = e.target.result; currentOpenName = namePart; }; t.oncomplete = () => { loadFromDB(); const blob = new Blob([JSON.stringify(data)], {type:'application/json'}); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = fileName; a.click(); lastFileDisplay.innerHTML = `<span class="label-red">Utolsó fájl:</span> <span class="label-green">${fileName}</span>`; }; }
  function loadNote(){ const name = prompt("Keresett név:"); const found = notes.find(n=>n.name === name); if(found) { editor.innerHTML = found.content; editorHeader.innerHTML = `<span class="${found.color}">${found.intro} - ${found.name} - ${found.timestamp}</span>`; setRecordedTime(found.timestamp); if(found.font) editor.style.fontFamily=found.font; if(found.size) editor.style.fontSize=found.size; currentOpenId = found.id; currentOpenName = found.name; setTimeout(updateLineCount,20); } }
  function deleteNote(){
    if(currentOpenId !== null){ const found = notes.find(n=>n.id===currentOpenId); if(found){ if(!confirm(`Törli VALÓSAN a megnyitott jegyzetet?\n\nNév: '${found.name}'\n`)) return; const t=db.transaction("notes","readwrite"); t.objectStore("notes").delete(found.id); t.oncomplete=()=>{ loadFromDB(); editor.innerHTML=""; editorHeader.innerHTML=""; setRecordedTime(""); currentOpenId = null; currentOpenName = null; lastFileDisplay.innerHTML = `<span class="label-red">Utolsó fájl:</span> <span class="label-green">Törölve: ${found.name}</span>`; updateStorageStatus(); updateLineCount(); }; return; } }
    let nameToDelete = prompt("Törlendő jegyzet neve:"); if(!nameToDelete) return; const found = notes.filter(n=>n.name===nameToDelete); if(found.length===0){ alert(`Nincs ilyen: '${nameToDelete}'`); return; } if(!confirm(`${found.length} db '${nameToDelete}' törlése?`)) return; const t=db.transaction("notes","readwrite"); const store=t.objectStore("notes"); found.forEach(n=>store.delete(n.id)); t.oncomplete=()=>{ loadFromDB(); if(currentOpenName===nameToDelete){ editor.innerHTML=""; editorHeader.innerHTML=""; currentOpenId=null; currentOpenName=null; setRecordedTime(""); updateLineCount(); } lastFileDisplay.innerHTML = `<span class="label-red">Utolsó fájl:</span> <span class="label-green">Törölve: ${nameToDelete}</span>`; updateStorageStatus(); };
  }
  function deleteNoteById(id){ const found = notes.find(n=>n.id===id); const nev = found? found.name : id; if(!confirm(`Törli '${nev}'?`)) return; const t=db.transaction("notes","readwrite"); t.objectStore("notes").delete(id); t.oncomplete=()=>{ loadFromDB(); if(currentOpenId===id){ editor.innerHTML=""; editorHeader.innerHTML=""; currentOpenId=null; currentOpenName=null; setRecordedTime(""); updateLineCount(); } }; }
  function addSavedItemToUI(note){ const div=document.createElement("div"); div.className="saved-item"; div.innerHTML=`<div><span class="${note.color}">${note.name}</span><br><small style="color:#888">${note.timestamp}</small></div><button class="del-icon" onclick="event.stopPropagation(); deleteNoteById(${note.id})">X</button>`; div.onclick=()=>{ const f=notes.find(n=>n.id===note.id); if(f){ editor.innerHTML=f.content; editorHeader.innerHTML=`<span class="${f.color}">${f.intro||""} - ${f.name} - ${f.timestamp}</span>`; if(f.font) editor.style.fontFamily=f.font; if(f.size) editor.style.fontSize=f.size; setRecordedTime(f.timestamp); currentOpenId = f.id; currentOpenName = f.name; setTimeout(updateLineCount,20); } }; savedList.appendChild(div); }
  function exportNotes(){ if(notes.length===0){ alert("Nincs mit exportálni!"); return; } const now = new Date(); const dateStr = now.toISOString().split('T')[0]; const timeStr = now.getHours().toString().padStart(2,'0') + "-" + now.getMinutes().toString().padStart(2,'0'); const defaultName = `ULTRA-NOTE_${dateStr}_${timeStr}`; const exportName = prompt("Add meg az exportált fájl nevét:", defaultName); if (!exportName) return; const blob = new Blob([JSON.stringify(notes)], {type:'application/json'}); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = exportName + ".json"; a.click(); }
  function importNotes(){ const input=document.createElement("input"); input.type="file"; input.accept=".json"; input.style.display="none"; document.body.appendChild(input); input.onchange=e=>{ const file=e.target.files[0]; if(!file){ document.body.removeChild(input); return; } const reader=new FileReader(); reader.onload=ev=>{ try{ let raw=JSON.parse(ev.target.result); let imp=raw; if(raw.modules && raw.modules['4_ultra']) imp=raw.modules['4_ultra']; if(imp && imp.notes && Array.isArray(imp.notes)) imp=imp.notes; if(!window.db){ const req = indexedDB.open("NeonNotesDB", 1); req.onupgradeneeded = ev=>{ const d=ev.target.result; if(!d.objectStoreNames.contains("notes")) d.createObjectStore("notes", {keyPath:"id", autoIncrement:true}); }; req.onsuccess = ev=>{ window.db=ev.target.result; doImport(window.db, imp); document.body.removeChild(input); }; } else { doImport(window.db, imp); document.body.removeChild(input); } } catch(err){ alert("Hiba: " + err.message); } }; reader.readAsText(file); }; input.click(); }
  function doImport(dbInst, imp){ try{ const t=dbInst.transaction("notes","readwrite"); const store=t.objectStore("notes"); if(Array.isArray(imp)){ imp.forEach(n=>{ if(n && typeof n==='object'){ const copy={...n}; delete copy.id; store.put(copy); } }); } else if(imp && typeof imp==='object'){ const copy={...imp}; delete copy.id; store.put(copy); } t.oncomplete=()=>{ loadFromDB(); alert("Importálva! " + (Array.isArray(imp)? imp.length : 1) + " jegyzet"); }; }catch(e){ alert("Import hiba: " + e.message); } }
  function clearList() { if(confirm("Üríti a teljes mentett listát?")) { const t = db.transaction("notes", "readwrite"); t.objectStore("notes").clear(); t.oncomplete = () => { notes=[]; savedList.innerHTML=""; updateStorageStatus(); setRecordedTime(""); lastFileDisplay.innerHTML = `<span class="label-red">Utolsó fájl:</span> <span class="label-green">Nincs mentés</span>`; }; } }
  function newNote(){ editor.innerHTML=""; editorHeader.innerHTML=""; setRecordedTime(""); updateLineCount(); }
  function insertLink(){ let url = linkInput.value.trim(); if(url) { if(!url.startsWith("http")) url = "https://" + url; const linkHTML = `<a href="${url}" target="_blank" class="${activeColorClass}">${url}</a><span class="${activeColorClass}">&nbsp;</span>`; insertHTMLAtCursor(linkHTML); linkInput.value = ""; } }
  async function downloadPNG(transparent){
    const fullWidth = window.innerWidth; const full = document.createElement("div"); full.style.position="fixed"; full.style.left="-10000px"; full.style.top="0"; full.style.width = fullWidth + "px"; full.style.padding="40px"; full.style.display="block";
    if(transparent){ full.style.background="transparent"; full.style.backgroundColor="transparent"; } else { full.style.background="#050505"; full.style.backgroundColor="#050505"; }
    const hdr = document.createElement("div"); hdr.innerHTML = editorHeader.innerHTML || ""; hdr.style.marginBottom="20px"; hdr.style.paddingBottom="10px"; hdr.style.borderBottom="1px dashed #333"; hdr.style.background="transparent";
    const edt = document.createElement("div"); edt.innerHTML = editor.innerHTML || "<br>"; edt.style.fontFamily = editor.style.fontFamily || "Arial"; edt.style.fontSize = editor.style.fontSize || "20px"; edt.style.lineHeight="1.1"; edt.style.whiteSpace="pre-wrap"; edt.style.background="transparent"; edt.style.height="auto"; edt.style.overflow="visible";
    full.appendChild(hdr); full.appendChild(edt); document.body.appendChild(full);
    const canvas = await html2canvas(full, { backgroundColor: transparent ? null : "#050505", scale:2, useCORS:true, logging:false, width: fullWidth });
    document.body.removeChild(full); const a=document.createElement("a"); a.download = transparent ? `ULTRA_note_transparent_FULL_${Date.now()}.png` : `ULTRA_note_black_FULL_${Date.now()}.png`; a.href = canvas.toDataURL("image/png"); a.click();
  }
  async function downloadPDF(isColor) {
    const helperWrap = document.createElement("div"); helperWrap.style.position="fixed"; helperWrap.style.left="-10000px"; helperWrap.style.top="0"; helperWrap.style.width="210mm"; helperWrap.style.background=isColor?"#050505":"#ffffff"; helperWrap.style.padding="30px";
    helperWrap.innerHTML = `<div>${editorHeader.outerHTML}${editor.outerHTML}</div>`; if(!isColor){ helperWrap.querySelectorAll("span,a,div").forEach(el=>{ el.style.setProperty("color","black","important"); el.style.setProperty("text-shadow","none","important"); }); }
    document.body.appendChild(helperWrap); const canvas = await html2canvas(helperWrap, { backgroundColor: isColor?"#050505":"#ffffff", scale:2 }); document.body.removeChild(helperWrap);
    const { jsPDF } = window.jspdf; const pdf = new jsPDF('p','mm','a4'); const w=210; const h=(canvas.height*w)/canvas.width; pdf.addImage(canvas.toDataURL('image/png'),'PNG',0,0,w,h); pdf.save(`jegyzet_${getFormattedDate()}.pdf`);
  }

<script>
document.addEventListener('DOMContentLoaded', ()=>{
  const sel = document.getElementById('ultra-color-v3');
  const neonBtn = document.getElementById('ultra-neon-v3');
  const glowBtnOriginal = document.getElementById('glowBtn');

  function fakeEvent(){ return { preventDefault:()=>{} }; }

  if(sel){
    sel.addEventListener('change', (e)=>{
      const cls = e.target.value;
      // use existing function
      if(typeof applyColorAndSet === 'function'){
        applyColorAndSet(fakeEvent(), cls);
      }
      try{ localStorage.setItem('ultra_v3_color', cls); }catch(err){}
    });
    // load saved
    try{
      const saved = localStorage.getItem('ultra_v3_color');
      if(saved){ sel.value = saved; }
    }catch(err){}
  }

  // Neon toggle uses existing toggleGlow + sync button
  let neonOn = true;
  function updateNeonBtn(){
    if(neonOn){
      neonBtn.textContent = '💡 NEON: BE';
      neonBtn.style.background = '#00ff00';
      neonBtn.style.color = '#000';
    } else {
      neonBtn.textContent = '💡 NEON: KI';
      neonBtn.style.background = '#ff0000';
      neonBtn.style.color = '#fff';
    }
  }

  if(neonBtn){
    neonBtn.addEventListener('click', ()=>{
      if(typeof toggleGlow === 'function'){ toggleGlow(); }
      // read state from body class or glowBtn
      const isOff = document.body.classList.contains('glow-off');
      neonOn = !isOff;
      updateNeonBtn();
      try{ localStorage.setItem('ultra_v3_neon', neonOn ? 'on':'off'); }catch(err){}
    });
  }

  // sync with original glow button if exists
  if(glowBtnOriginal){
    const observer = new MutationObserver(()=>{
      const isOff = document.body.classList.contains('glow-off');
      neonOn = !isOff;
      updateNeonBtn();
    });
    observer.observe(document.body, {attributes:true, attributeFilter:['class']});
  }

  // restore neon state
  try{
    const savedNeon = localStorage.getItem('ultra_v3_neon');
    if(savedNeon === 'off'){
      if(typeof toggleGlow === 'function' && !document.body.classList.contains('glow-off')){
        toggleGlow();
        neonOn = false;
        updateNeonBtn();
      }
    }
  }catch(err){}
});
</script>


<script>
(function(){
  const colorMap = {
    'neon-white': { hex:'#ffffff', shadow:'0 0 5px #ffffff, 0 0 10px #ffffff, 0 0 15px #ffffff' },
    'neon-cyan': { hex:'#00f6ff', shadow:'0 0 5px #00f6ff, 0 0 10px #00f6ff, 0 0 15px #00f6ff' },
    'neon-red': { hex:'#ff0000', shadow:'0 0 5px #ff0000, 0 0 10px #ff0000, 0 0 15px #ff0000' },
    'neon-deepblue': { hex:'#0080ff', shadow:'0 0 5px #0080ff, 0 0 10px #0080ff, 0 0 15px #0080ff' },
    'neon-blue': { hex:'#00aaff', shadow:'0 0 5px #00aaff, 0 0 10px #00aaff, 0 0 15px #00aaff' },
    'neon-green': { hex:'#00ff00', shadow:'0 0 5px #00ff00, 0 0 10px #00ff00, 0 0 15px #00ff00' },
    'neon-yellow': { hex:'#ffff00', shadow:'0 0 5px #ffff00, 0 0 10px #ffff00, 0 0 15px #ffff00' },
    'neon-magenta': { hex:'#ff00ff', shadow:'0 0 5px #ff00ff, 0 0 10px #ff00ff, 0 0 15px #ff00ff' },
    'neon-orange': { hex:'#ff6600', shadow:'0 0 5px #ff6600, 0 0 10px #ff6600, 0 0 15px #ff6600' }
  };

  function getOverrideStyle(){ return document.getElementById('globalColorOverride'); }

  function applyGlobalOverride(cls){
    const info = colorMap[cls];
    const styleEl = getOverrideStyle();
    if(!info || !styleEl) return;
    styleEl.textContent = `
      #mainTitle { color:${info.hex} !important; text-shadow:${info.shadow} !important; }
      #editor [class^='neon-'], #editorHeader [class^='neon-'] { color:${info.hex} !important; text-shadow:${info.shadow} !important; }
      body.glow-off #mainTitle, body.glow-off #editor [class^='neon-'], body.glow-off #editorHeader [class^='neon-'] { text-shadow:none !important; }
    `;
  }

  function forceRecolorSelection(newClass){
    const sel = window.getSelection();
    if(!sel || sel.rangeCount===0) return false;
    const selectedText = sel.toString();
    if(selectedText.length===0) return false;
    // Use existing applyColorAndSet if available for selected range
    if(typeof applyColorAndSet === 'function'){
      try{
        applyColorAndSet({preventDefault:()=>{}}, newClass);
        return true;
      }catch(e){}
    }
    // Fallback manual
    try{
      const range = sel.getRangeAt(0);
      const span = document.createElement('span');
      span.className = newClass;
      span.textContent = selectedText;
      range.deleteContents();
      range.insertNode(span);
      return true;
    }catch(e){ return false; }
  }

  function recolorAllEditor(newClass){
    const editor = document.getElementById('editor');
    if(editor){
      editor.querySelectorAll('[class^="neon-"]').forEach(el=>{ el.className = newClass; });
    }
    const header = document.getElementById('editorHeader');
    if(header){
      const s = header.querySelector('span');
      if(s) s.className = newClass;
    }
    const mainTitle = document.getElementById('mainTitle');
    if(mainTitle) mainTitle.className = newClass;
  }

  document.addEventListener('DOMContentLoaded', ()=>{
    const sel = document.getElementById('ultra-color-v3') || document.getElementById('ultra-color-v4') || document.getElementById('ultra-color-v5') || document.querySelector('select[id^="ultra-color"]');
    if(!sel) return;

    // Upgrade change handler to also handle selection
    sel.addEventListener('change', (e)=>{
      const cls = e.target.value;
      const hadSelection = window.getSelection() && window.getSelection().toString().length>0;

      if(hadSelection){
        forceRecolorSelection(cls);
      } else {
        // if no selection, recolor all + set active
        recolorAllEditor(cls);
        if(typeof applyColorAndSet === 'function'){
          applyColorAndSet({preventDefault:()=>{}}, cls);
        }
      }
      try{ activeColorClass = cls; window.activeColorClass = cls; }catch(e){}
      applyGlobalOverride(cls);
      try{
        localStorage.setItem('ultra_final_color', cls);
        localStorage.setItem('ultra_v5_color', cls);
        localStorage.setItem('ultra_v3_color', cls);
        localStorage.setItem('ultra_v4_color', cls);
      }catch(e){}
    });

    // Restore on load
    try{
      const saved = localStorage.getItem('ultra_final_color') || localStorage.getItem('ultra_v5_color') || localStorage.getItem('ultra_v4_color') || localStorage.getItem('ultra_v3_color');
      if(saved){
        sel.value = saved;
        applyGlobalOverride(saved);
        try{ activeColorClass = saved; window.activeColorClass = saved; }catch(e){}
        const mt = document.getElementById('mainTitle');
        if(mt) mt.className = saved;
      }
    }catch(e){}

    // Also patch loadFromDB to re-apply after DB load
    if(window.loadFromDB){
      const orig = window.loadFromDB;
      window.loadFromDB = function(){
        const r = orig.apply(this, arguments);
        setTimeout(()=>{
          try{
            const s = localStorage.getItem('ultra_final_color') || localStorage.getItem('ultra_v5_color');
            if(s) applyGlobalOverride(s);
          }catch(e){}
        }, 400);
        return r;
      };
    }
  });
})();
</script>
