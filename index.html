function closeExportModal(){ document.getElementById('exportModal').classList.remove('show'); }
function openResetModal(){ document.getElementById('resetModal').classList.add('show'); }
function closeResetModal(){ document.getElementById('resetModal').classList.remove('show'); }
function getFallback2(){ try{ const v=localStorage.getItem('Securics08_Alsokep_notes_v2'); if(v){ const p=JSON.parse(v); return {notes:p,current:localStorage.getItem('Securics08_Alsokep_current_v2')||Object.keys(p)[0]||''}; } }catch(e){} return null; }
function getFallback3(){ try{ const v=localStorage.getItem('NotesUltraDB_notes')||localStorage.getItem('Vegtelen_notes'); if(v){ const p=JSON.parse(v); return p.notes||p; } }catch(e){} return null; }
async function doExport(){
  const name=document.getElementById('exportNameInput').value.trim(); if(!name) return;
  const mode=document.querySelector('input[name="expMode"]:checked')?.value||'all';
  if(mode==='sep'){ closeExportModal(); doExportSeparate(name); return; }
  closeExportModal(); showStatus('⏳ Export 6 menüből...',' #ff0',8000);
  pending={}; const iframes=[]; for(let i=0;i<6;i++) iframes.push(document.getElementById('f'+i));
  const prom=new Promise(r=>{ resolver=r; setTimeout(()=>r(pending),8500); });
  const send=()=>iframes.forEach(f=>{ try{ f.contentWindow.postMessage({type:'EXPORT_4IN1_REQUEST'},'*'); }catch(e){} });
  send(); setTimeout(send,600); setTimeout(send,1800); setTimeout(send,3200);
  let results=await prom; resolver=null;
  if(!results['2_alsokep']){ const fb=getFallback2(); if(fb) results['2_alsokep']=fb; }
  if(!results['3_vegtelen']){ const fb=getFallback3(); if(fb) results['3_vegtelen']=fb; }
  const now=new Date(); const pad=n=>String(n).padStart(2,'0'); const dateStr=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`; const timeStr=`${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`; const timeFile=`${pad(now.getHours())}-${pad(now.getMinutes())}-${pad(now.getSeconds())}`; const dt=now.toLocaleString('hu-HU');
  const full={version:"6in1-V32-KULON-JSON-NEV-DATUM-IDO",exportDate:dateStr,exportTime:timeStr,exportTimeFile:timeFile,exportDateTime:dt,exportTimestamp:now.getTime(),exportName:name,modules:{"1_neon_repo":results['1_neon_repo']||[],"2_alsokep":results['2_alsokep']||{notes:{},current:''},"3_vegtelen":results['3_vegtelen']||{},"4_ultra":results['4_ultra']||[],"5_neon_vault":results['5_neon_vault']||{id:"root",name:"Gyökér",type:"folder",children:[]},"6_discord":results['6_discord']||{}}};
  const blob=new Blob([JSON.stringify(full,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name.endsWith('.json')?name:name+'.json'; a.click(); URL.revokeObjectURL(a.href);
  const info=`1:${(full.modules['1_neon_repo']||[]).length} 2:${Object.keys(full.modules['2_alsokep'].notes||full.modules['2_alsokep']||{}).length} 3:${Object.keys(full.modules['3_vegtelen'].notes||full.modules['3_vegtelen']||{}).length} 4:${(full.modules['4_ultra']||[]).length} 5:${(full.modules['5_neon_vault'].children||[]).length} 6:${Object.keys(full.modules['6_discord']||{}).length} | Név:${name} Dátum:${dateStr} Idő:${timeStr}`;
  showStatus('✅ EXPORT KÉSZ!\n'+info,'#0f0',8000); logD('EXPORT: '+info);
}
async function doExportSeparate(baseName){
  const now=new Date(); const pad=n=>String(n).padStart(2,'0'); const dateStr=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`; const timeStr=`${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`; const timeFile=`${pad(now.getHours())}-${pad(now.getMinutes())}-${pad(now.getSeconds())}`; const dt=now.toLocaleString('hu-HU');
  let base=baseName||document.getElementById('exportNameInput')?.value?.trim()||`6in1-V32_${dateStr}_${timeFile}`;
  showStatus('⏳ Külön JSON export 6 menüből...',' #ff0',8000);
  pending={}; const iframes=[]; for(let i=0;i<6;i++) iframes.push(document.getElementById('f'+i));
  const prom=new Promise(r=>{ resolver=r; setTimeout(()=>r(pending),8500); });
  const send=()=>iframes.forEach(f=>{ try{ f.contentWindow.postMessage({type:'EXPORT_4IN1_REQUEST'},'*'); }catch(e){} });
  send(); setTimeout(send,600); setTimeout(send,1800); setTimeout(send,3200);
  let results=await prom; resolver=null;
  if(!results['2_alsokep']){ const fb=getFallback2(); if(fb) results['2_alsokep']=fb; }
  if(!results['3_vegtelen']){ const fb=getFallback3(); if(fb) results['3_vegtelen']=fb; }
  const keys=["1_neon_repo","2_alsokep","3_vegtelen","4_ultra","5_neon_vault","6_discord"];
  const names=["1_Neon_Repo","2_OCR_Teljes","3_Vegtelen","4_ULTRA","5_Vault","6_Discord"];
  let c=0;
  for(let i=0;i<keys.length;i++){
    const k=keys[i]; const data=results[k]; if(!data) continue;
    let cnt=0; if(Array.isArray(data)) cnt=data.length; else if(data.notes) cnt=Object.keys(data.notes).length; else if(data.children) cnt=data.children.length; else cnt=Object.keys(data||{}).length;
    const obj={version:"6in1-V32-KULON",module:k,moduleName:names[i],exportName:`${base}_${names[i]}`,exportDate:dateStr,exportTime:timeStr,exportTimeFile:timeFile,exportDateTime:dt,exportTimestamp:now.getTime(),count:cnt,data:data};
    const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`${base}_${names[i]}_${dateStr}_${timeFile}.json`;
    setTimeout(((aa)=>()=>{ aa.click(); URL.revokeObjectURL(aa.href); })(a), i*450);
    c++; logD(`✓ ${k} = ${cnt} db -> ${a.download}`);
  }
  showStatus(`✅ KÜLÖN EXPORT KÉSZ! ${c} db JSON | Név:${base} Dátum:${dateStr} Idő:${timeStr}`,'#0f0',8000);
}
function doResetAllData(){
  closeResetModal(); if(!confirm('BIZTOS? Minden törlődik!')) return;
  showStatus('💥 RESET...','#f00',7000);
  const iframes=[]; for(let i=0;i<6;i++) iframes.push(document.getElementById('f'+i));
  const send=()=>iframes.forEach(f=>{ try{ f.contentWindow.postMessage({type:'RESET_4IN1_ALL'},'*'); }catch(e){} });
  send(); setTimeout(send,600); setTimeout(send,1500);
  try{
    const keys=[]; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(!k) continue; const lk=k.toLowerCase(); if(lk.includes('alsokep')||lk.includes('securics')||lk.includes('vegtelen')||lk.includes('notesultra')||lk.includes('all_notes')||lk.includes('neon')||k.includes('4in1_backup_')||k.includes('discord')) keys.push(k); }
    keys.forEach(k=>{ try{ localStorage.removeItem(k);}catch(e){} });
  }catch(e){}
  setTimeout(()=>{
    const fresh=b64htmls.map(b64ToUtf8); document.querySelectorAll('iframe').forEach((f,i)=>{ try{ f.srcdoc=fresh[i]; }catch(e){} });
    setTimeout(()=>{ showTab(0); refreshAll(); showStatus('💥 RESET kész!','#0f0',5000); },1000);
  },3000);
}
function triggerImport(){ document.getElementById('importFileInput').click(); }
document.getElementById('importFileInput').addEventListener('change', async (e)=>{
  const files=Array.from(e.target.files||[]); if(files.length===0) return;
  try{
    if(files.length>1){
      for(const file of files){
        try{
          const text=await file.text(); const data=JSON.parse(text);
          let key=data.module||null;
          if(!key){
            const l=file.name.toLowerCase();
            if(l.includes('1_')||l.includes('neon_repo')) key='1_neon_repo';
            else if(l.includes('2_')||l.includes('ocr')&&l.includes('teljes')) key='2_alsokep';
            else if(l.includes('3_')||l.includes('vegtelen')) key='3_vegtelen';
            else if(l.includes('4_')||l.includes('ultra')) key='4_ultra';
            else if(l.includes('5_')||l.includes('vault')) key='5_neon_vault';
            else if(l.includes('6_')||l.includes('discord')) key='6_discord';
          }
          if(key){
            const map={'1_neon_repo':{f:document.getElementById('f0'),s:'1_neon_repo',d:data.data||data},'2_alsokep':{f:document.getElementById('f1'),s:'2_alsokep',d:data.data||data},'3_vegtelen':{f:document.getElementById('f2'),s:'3_vegtelen',d:data.data||data},'4_ultra':{f:document.getElementById('f3'),s:'4_ultra',d:data.data||data},'5_neon_vault':{f:document.getElementById('f4'),s:'5_neon_vault',d:data.data||data},'6_discord':{f:document.getElementById('f5'),s:'6_discord',d:data.data||data}};
            const m=map[key]; if(m){ const send=()=>{ try{ m.f.contentWindow.postMessage({type:'IMPORT_4IN1_DATA',source:m.s,data:m.d},'*'); }catch(e){} }; send(); setTimeout(send,400); setTimeout(send,1000); logD(`✓ IMPORT ${key} <- ${file.name} | Név:${data.exportName||''} Dátum:${data.exportDate||''} Idő:${data.exportTime||''}`); }
          } else if(data.modules){
            const mods=data.modules; const mapping=[{f:document.getElementById('f0'),s:'1_neon_repo',d:mods['1_neon_repo']},{f:document.getElementById('f1'),s:'2_alsokep',d:mods['2_alsokep']},{f:document.getElementById('f2'),s:'3_vegtelen',d:mods['3_vegtelen']},{f:document.getElementById('f3'),s:'4_ultra',d:mods['4_ultra']},{f:document.getElementById('f4'),s:'5_neon_vault',d:mods['5_neon_vault']},{f:document.getElementById('f5'),s:'6_discord',d:mods['6_discord']}].filter(x=>x.f&&x.d);
            const sendAll=()=>mapping.forEach(m=>{ try{ m.f.contentWindow.postMessage({type:'IMPORT_4IN1_DATA',source:m.s,data:m.d},'*'); }catch(e){} }); sendAll(); setTimeout(sendAll,700); setTimeout(sendAll,1600);
          }
        }catch(err){ console.error(err); }
      }
      showStatus(`✅ IMPORT KÉSZ! ${files.length} fájl`,'#0f0',6000);
      setTimeout(()=>{ const fresh=b64htmls.map(b64ToUtf8); document.querySelectorAll('iframe').forEach((f,i)=>{ try{ f.srcdoc=fresh[i]; }catch(e){} }); setTimeout(()=>{ showTab(0); refreshAll(); },1000); },3000);
      e.target.value=''; return;
    }
    const file=e.target.files[0]; const text=await file.text(); const data=JSON.parse(text);
    let info=''; if(data.modules){ const m=data.modules; info=`Név:${data.exportName||''}\nDátum:${data.exportDate||''} Idő:${data.exportTime||''}\n1:${(m['1_neon_repo']||[]).length} 2:${Object.keys(m['2_alsokep']?.notes||m['2_alsokep']||{}).length} 3:${Object.keys(m['3_vegtelen']?.notes||m['3_vegtelen']||{}).length} 4:${(m['4_ultra']||[]).length} 5:${(m['5_neon_vault']?.children||[]).length} 6:${Object.keys(m['6_discord']||{}).length}`; } else { info=`KÜLÖN JSON\nNév:${data.exportName||file.name}\nDátum:${data.exportDate||''} Idő:${data.exportTime||''}\nModul:${data.module||''} Darab:${data.count||''}`; }
    if(!confirm(`Importálod?\n\n${info}\n\nMinden felülíródik!`)) return;
    showStatus('⏳ Import...',' #08f',7000);
    try{
      if(data.modules){
        if(data.modules['2_alsokep']){ const n=data.modules['2_alsokep'].notes||data.modules['2_alsokep']; const cur=data.modules['2_alsokep'].current||Object.keys(n)[0]||''; if(Object.keys(n).length>0){ localStorage.setItem('Securics08_Alsokep_notes_v2', JSON.stringify(n)); localStorage.setItem('Securics08_Alsokep_current_v2', cur); } }
        if(data.modules['3_vegtelen']){ const n=data.modules['3_vegtelen'].notes||data.modules['3_vegtelen']; if(Object.keys(n).length>0){ localStorage.setItem('NotesUltraDB_notes', JSON.stringify(n)); localStorage.setItem('Vegtelen_notes', JSON.stringify(n)); localStorage.setItem('all_notes', JSON.stringify(n)); } }
      }
    }catch(e){}
    const mods=data.modules||{[data.module]:data.data||data};
    const mapping=[{f:document.getElementById('f0'),s:'1_neon_repo',d:mods['1_neon_repo']},{f:document.getElementById('f1'),s:'2_alsokep',d:mods['2_alsokep']},{f:document.getElementById('f2'),s:'3_vegtelen',d:mods['3_vegtelen']},{f:document.getElementById('f3'),s:'4_ultra',d:mods['4_ultra']},{f:document.getElementById('f4'),s:'5_neon_vault',d:mods['5_neon_vault']},{f:document.getElementById('f5'),s:'6_discord',d:mods['6_discord']}].filter(x=>x.f&&x.d);
    const sendAll=()=>mapping.forEach(m=>{ try{ m.f.contentWindow.postMessage({type:'IMPORT_4IN1_DATA',source:m.s,data:m.d},'*'); }catch(e){} }); sendAll(); setTimeout(sendAll,700); setTimeout(sendAll,1700); setTimeout(sendAll,3000);
    setTimeout(()=>{ const fresh=b64htmls.map(b64ToUtf8); document.querySelectorAll('iframe').forEach((f,i)=>{ try{ f.srcdoc=fresh[i]; }catch(e){} }); setTimeout(()=>{ showTab(0); refreshAll(); showStatus('✅ IMPORT kész!',' #0f0',6000); },1000); },3500);
  }catch(err){ alert('Hiba:'+err.message); console.error(err); }
  e.target.value='';
});
